# Surface Pro 7+: hide the IR sensor (OV7251) from PipeWire camera clients.
# libcamera only offers raw Y10 for it, which no app can show, and opening it
# lights the IR illuminator.
# Installed by SurfaceTabletKit (modules/sp7p-kernel).
monitor.libcamera.rules = [
  {
    matches = [
      {
        # ACPI path of the INT347E sensor (\_SB_.PC00.I2C3.CAM3); device.product.name
        # is filled in only after the rules ran, so it cannot be matched here.
        api.libcamera.path = "~.*CAM3$"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
