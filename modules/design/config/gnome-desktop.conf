# GNOME desktop settings of the SurfaceTabletKit look (measured on a Surface Pro 7+).
# Load with:  dconf load /org/gnome/desktop/ < gnome-desktop.conf
# dconf load only sets the keys listed here, everything else stays as it is.
# Deliberately NOT included: display scaling (device specific, see monitors.xml) and
# stylus/tablet calibration (device specific).

[interface]
gtk-theme='MacTahoe-Dark'
icon-theme='Colloid-Dark'
cursor-theme='WhiteSur-cursors'
cursor-size=24
color-scheme='prefer-dark'
accent-color='blue'
font-name='Inter 11'
document-font-name='Inter 11'
font-antialiasing='grayscale'
font-hinting='slight'
text-scaling-factor=1.0
clock-format='24h'
clock-show-weekday=true
clock-show-date=true
clock-show-seconds=false
show-battery-percentage=true

[wm/preferences]
button-layout='close,minimize,maximize:'
titlebar-font='Inter Display Bold 11'

[background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/gnome/glass-chip-l.jxl'
picture-uri-dark='file:///usr/share/backgrounds/gnome/glass-chip-d.jxl'

[screensaver]
picture-uri='file:///usr/share/backgrounds/gnome/glass-chip-l.jxl'

[peripherals/touchpad]
tap-to-click=true
natural-scroll=true
two-finger-scrolling-enabled=true
