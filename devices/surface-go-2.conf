# Surface Go 2 (Intel Amber Lake Y, 10.5" 1920x1280)
# DMI product name as matched by the upstream surface_go_2 board-file patch
# (https://lkml.iu.edu/2108.3/01643.html). Not yet verified on a real device by this kit:
# install.sh prints the value it reads, so a mismatch is visible.
DMI_PRODUCT_NAME="Surface Go 2"
DEVICE_NAME="Surface Go 2"
RECOMMENDED_SCALE=            # measure the panel and choose with the user
TOUCH_DEVICE_WHITELIST=       # measure: sudo libinput list-devices
TOUCH_UNITS_PER_MM=           # measure: libinput list-devices (size in mm) + evtest ranges
AUDIO_PRESET=                 # measure: tools/measure-speakers.py, build a preset from the template
NEEDS_TOUCH_ANCHOR=check      # run tools/touch-log.sh across a suspend; anchor only if touch devices are re-created
RECOMMENDED_MODULES="design rounded-blur osk screen-rotate panel-portrait plymouth flatpak-theming touch-right-click audio power"
