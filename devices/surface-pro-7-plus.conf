# Surface Pro 7+ (Intel Tiger Lake, 12.3" 2736x1824, IPTS touch via ithc + iptsd)
# Measured on a real device. See devices/surface-pro-7-plus.md.
DMI_PRODUCT_NAME="Surface Pro 7+"
DEVICE_NAME="Surface Pro 7+"
RECOMMENDED_SCALE=2            # 200 % at 2736x1824
TOUCH_DEVICE_WHITELIST="IPTSD Virtual Touchscreen 045E:0C1A"
TOUCH_UNITS_PER_MM=37          # iptsd virtual touchscreen: 0..9600 x 0..7200
AUDIO_PRESET="SurfacePro7+ v3"
# Touch devices are removed and re-created on every resume (ithc re-probe) -> touch-anchor needed
NEEDS_TOUCH_ANCHOR=yes
RECOMMENDED_MODULES="design rounded-blur osk screen-rotate panel-portrait plymouth flatpak-theming touch-right-click touch-anchor audio power sp7p-kernel"
